<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="robots" content="noindex, nofollow" />
<title>PromptVault — Admin</title>
<style>
:root{color-scheme:light dark;--bg:#f4f8f6;--surface:#fff;--surface2:#eaf2ee;--text:#11231c;--muted:#557065;--line:#cfddd6;--accent:#087f5b;--accent2:#056646;--soft:#d9f6e9;--accentInk:#034b34;--danger:#c0392b;--shadow:0 18px 50px rgba(16,55,40,.1)}
@media(prefers-color-scheme:dark){:root{--bg:#07110e;--surface:#0d1915;--surface2:#13231d;--text:#edf8f2;--muted:#9cb5aa;--line:#213a30;--accent:#42d69c;--accent2:#70e9bb;--soft:#113d2e;--accentInk:#aaf2d5;--shadow:0 22px 60px rgba(0,0,0,.28)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:auto;padding:40px 20px 80px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.brand{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:9px}
.brand:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow);margin-bottom:22px}
.card h2{margin:0 0 6px;font-size:1.35rem;letter-spacing:-.02em}
.card p.sub{margin:0 0 20px;color:var(--muted);font-size:.88rem}
label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin:16px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:11px 13px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
textarea{min-height:130px;resize:vertical;font-family:ui-monospace,monospace;font-size:.85rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:11px;border:1px solid transparent;background:var(--accent);color:#fff;font-weight:700;font-size:.92rem;cursor:pointer;margin-top:20px}
.btn:hover{background:var(--accent2)}.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--text);margin-left:10px}.btn.ghost:hover{border-color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--line);color:var(--danger);min-height:38px;padding:0 14px;font-size:.8rem;margin:0}
.btn.small{min-height:38px;padding:0 14px;font-size:.8rem;margin:0}
.err{display:none;background:#fdeceb;border:1px solid #f5c6c0;color:#a93226;border-radius:10px;padding:11px 14px;font-size:.85rem;margin-top:16px}
.ok{display:none;background:var(--soft);border:1px solid var(--line);color:var(--accentInk);border-radius:10px;padding:11px 14px;font-size:.85rem;margin-top:16px}
.plist{display:grid;gap:10px}
.prow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 16px}
.prow .info{flex:1;min-width:0}.prow .t{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .m{font-size:.75rem;color:var(--muted)}
.badge{font-size:.65rem;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.badge.free{color:var(--accentInk);background:var(--soft)}
.prow .acts{display:flex;gap:8px}
.mediaPrev{margin-top:10px;max-width:100%;border-radius:10px;border:1px solid var(--line);display:none}
.hint{font-size:.76rem;color:var(--muted);margin-top:6px}
.hidden{display:none!important}
@media(max-width:560px){.row{grid-template-columns:1fr}.card{padding:20px}}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar"><div class="brand">PromptVault · Admin</div><button class="btn ghost small hidden" id="logoutBtn" type="button" style="margin:0">Log out</button></div>

<!-- LOGIN -->
<div class="card" id="loginView">
<h2>Admin login</h2>
<p class="sub">Sirf tumhara account yahan login kar sakta hai.</p>
<label for="email">Email</label>
<input type="email" id="email" autocomplete="username" placeholder="tumhara@email.com">
<label for="password">Password</label>
<input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
<button class="btn" id="loginBtn" type="button">Log in</button>
<div class="err" id="loginErr"></div>
</div>

<!-- APP -->
<div id="appView" class="hidden">
<div class="card">
<h2 id="formTitle">Naya prompt add karo</h2>
<p class="sub">Save karte hi ye site pe live ho jayega.</p>
<div class="row">
<div><label for="f_cat">Section</label>
<select id="f_cat"><option value="tiktok">TikTok</option><option value="youtube">YouTube</option></select></div>
<div><label for="f_access">Access</label>
<select id="f_access"><option value="free">Free</option><option value="pro">Pro (members)</option></select></div>
</div>
<label for="f_title">Title</label>
<input type="text" id="f_title" placeholder="e.g. Cinematic Scene Builder">
<label for="f_prompt">Prompt text</label>
<textarea id="f_prompt" placeholder="Poora prompt yahan likho…"></textarea>
<label for="f_media">Video / Image / Thumbnail (optional)</label>
<input type="file" id="f_media" accept="image/*,video/*">
<div class="hint">TikTok ke liye <b>vertical (9:16)</b> aur YouTube ke liye <b>horizontal (16:9)</b> file lagao — taake poori dikhe, kaate ya black sides ke baghair.</div>
<img class="mediaPrev" id="mediaPrevImg" alt="">
<div class="hint" id="mediaHint"></div>
<div class="row">
<div><label for="f_order">Order (optional, chhota number pehle)</label>
<input type="number" id="f_order" value="0"></div>
</div>
<button class="btn" id="saveBtn" type="button">Save prompt</button>
<button class="btn ghost hidden" id="cancelBtn" type="button">Cancel edit</button>
<div class="err" id="formErr"></div><div class="ok" id="formOk"></div>
</div>

<div class="card">
<h2>Tumhare prompts</h2>
<p class="sub" id="countLine"></p>
<div class="plist" id="plist"></div>
</div>
</div>
</div>

<script>(function(){
var SB_URL="https://vfyuebkdkxhdrlduqxng.supabase.co";
var SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmeXVlYmtka3hoZHJsZHVxeG5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTI1NDQsImV4cCI6MjEwNjc2ODU0NH0.RY-VU33zwySGKmPH34pHs72HaxRt9yi4lAhHO9xn7_4";
var token=sessionStorage.getItem('pv_admin_token')||'';
var editingId=null, editingMedia=null;
function $(id){return document.getElementById(id)}
function showErr(el,msg){el.textContent=msg;el.style.display='block'}
function hideMsg(){['loginErr','formErr','formOk'].forEach(function(i){$(i).style.display='none'})}
function authHeaders(extra){var h={'apikey':SB_ANON,'Authorization':'Bearer '+(token||SB_ANON)};if(extra)for(var k in extra)h[k]=extra[k];return h}
function api(path,method,body,isFile){
  var h=authHeaders(isFile?{}:{'Content-Type':'application/json'});
  if(method!=='GET'&&!isFile)h['Prefer']='return=representation';
  return fetch(SB_URL+path,{method:method||'GET',headers:h,body:body}).then(function(r){
    return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null}catch(e){}
      if(!r.ok)throw new Error((j&&(j.message||j.msg))||('Error '+r.status));return j})});
}
function setLoggedIn(yes){
  $('loginView').classList.toggle('hidden',yes);
  $('appView').classList.toggle('hidden',!yes);
  $('logoutBtn').classList.toggle('hidden',!yes);
  if(yes)loadList();
}
$('loginBtn').onclick=function(){
  hideMsg();var em=$('email').value.trim(),pw=$('password').value;
  if(!em||!pw){showErr($('loginErr'),'Email aur password dono likho.');return}
  $('loginBtn').disabled=true;
  api('/auth/v1/token?grant_type=password','POST',JSON.stringify({email:em,password:pw}))
  .then(function(j){token=j.access_token;sessionStorage.setItem('pv_admin_token',token);$('password').value='';setLoggedIn(true)})
  .catch(function(e){showErr($('loginErr'),'Login nahi hua: '+e.message+'. (Supabase > Authentication > Users mein apna user bana lo.)')})
  .finally(function(){$('loginBtn').disabled=false});
};
$('logoutBtn').onclick=function(){token='';sessionStorage.removeItem('pv_admin_token');editingId=null;setLoggedIn(false)};
function resetForm(){$('formTitle').textContent='Naya prompt add karo';['f_title','f_prompt'].forEach(function(i){$(i).value=''});
  $('f_cat').value='tiktok';$('f_access').value='free';$('f_media').value='';$('f_order').value='0';
  $('mediaPrevImg').style.display='none';$('mediaHint').textContent='';$('cancelBtn').classList.add('hidden');
  editingId=null;editingMedia=null}
$('cancelBtn').onclick=resetForm;
$('f_media').onchange=function(){
  var f=$('f_media').files[0];if(!f){$('mediaPrevImg').style.display='none';$('mediaHint').textContent='';return}
  $('mediaHint').textContent='Selected: '+f.name+' ('+Math.round(f.size/1024)+' KB)';
  if(f.type.indexOf('image/')===0){var rd=new FileReader();rd.onload=function(e){$('mediaPrevImg').src=e.target.result;$('mediaPrevImg').style.display='block'};rd.readAsDataURL(f)}
  else $('mediaPrevImg').style.display='none';
};
function uploadMedia(file){
  var path=Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  return api('/storage/v1/object/prompt-media/'+path,'POST',file,true).then(function(){
    return {url:SB_URL+'/storage/v1/object/public/prompt-media/'+path,
            type:file.type.indexOf('video/')===0?'video':'image',path:path}});
}
function deleteMedia(path){if(!path)return Promise.resolve();return api('/storage/v1/object/prompt-media/'+path,'DELETE').catch(function(){})}
function mediaPath(url){var i=(url||'').indexOf('/prompt-media/');return i>-1?url.slice(i+14):null}
$('saveBtn').onclick=function(){
  hideMsg();
  var title=$('f_title').value.trim(),prompt=$('f_prompt').value.trim();
  if(!title||!prompt){showErr($('formErr'),'Title aur prompt text dono zaroori hain.');return}
  $('saveBtn').disabled=true;
  var file=$('f_media').files[0];
  var mediaPromise=file?uploadMedia(file):Promise.resolve(editingMedia?{url:editingMedia,type:mediaTypeOf(editingMedia)}:null);
  function mediaTypeOf(u){return /\.(mp4|webm|mov|m4v)(\?|$)/i.test(u)?'video':'image'}
  mediaPromise.then(function(m){
    if(file&&editingMedia)deleteMedia(mediaPath(editingMedia));
    var row={category:$('f_cat').value,title:title,prompt_text:prompt,
      media_url:m?m.url:null,media_type:m?m.type:null,
      is_pro:$('f_access').value==='pro',sort_order:parseInt($('f_order').value||'0',10)};
    return editingId?api('/rest/v1/prompts?id=eq.'+editingId,'PATCH',JSON.stringify(row))
                    :api('/rest/v1/prompts','POST',JSON.stringify(row));
  }).then(function(){
    var ok=$('formOk');ok.textContent=editingId?'Prompt update ho gaya.':'Naya prompt live ho gaya.';ok.style.display='block';
    resetForm();loadList();
  }).catch(function(e){showErr($('formErr'),'Save nahi hua: '+e.message)})
  .finally(function(){$('saveBtn').disabled=false});
};
function loadList(){
  api('/rest/v1/prompts?select=*&order=sort_order.asc,created_at.desc','GET').then(function(rows){
    $('countLine').textContent=rows.length+' prompt(s)';
    var pl=$('plist');pl.innerHTML='';
    if(!rows.length){pl.innerHTML='<p class="sub">Abhi koi prompt nahi — pehla add karo.</p>';return}
    rows.forEach(function(p){
      var d=document.createElement('div');d.className='prow';
      d.innerHTML='<div class="info"><div class="t"></div><div class="m"></div></div>'
        +'<span class="badge '+(p.is_pro?'':'free')+'">'+(p.is_pro?'PRO':'FREE')+'</span>'
        +'<div class="acts"><button class="btn small ghost" data-act="edit">Edit</button>'
        +'<button class="btn danger" data-act="del">Delete</button></div>';
      d.querySelector('.t').textContent=p.title;
      var cn=String(p.category||'').toLowerCase();cn=(cn==='youtube'||cn==='niche')?'YouTube':'TikTok';
      d.querySelector('.m').textContent=cn+(p.media_url?' · media':'')+' · '+new Date(p.created_at).toLocaleDateString();
      d.querySelector('[data-act=edit]').onclick=function(){startEdit(p)};
      d.querySelector('[data-act=del]').onclick=function(){delPrompt(p)};
      pl.appendChild(d);
    });
  }).catch(function(e){$('countLine').textContent='Load nahi hua: '+e.message});
}
function startEdit(p){
  editingId=p.id;editingMedia=p.media_url||null;
  $('formTitle').textContent='Prompt edit karo';var ec=String(p.category||'').toLowerCase();$('f_cat').value=(ec==='youtube'||ec==='niche')?'youtube':'tiktok';
  $('f_access').value=p.is_pro?'pro':'free';$('f_title').value=p.title;
  $('f_prompt').value=p.prompt_text;$('f_order').value=p.sort_order||0;$('f_media').value='';
  if(p.media_url&&p.media_type==='image'){$('mediaPrevImg').src=p.media_url;$('mediaPrevImg').style.display='block';$('mediaHint').textContent='Pehli file lagi hui hai — nayi select karoge to replace ho jayegi.'}
  else{$('mediaPrevImg').style.display='none';$('mediaHint').textContent=p.media_url?'Pehli video lagi hui hai — nayi select karoge to replace ho jayegi.':''}
  $('cancelBtn').classList.remove('hidden');hideMsg();window.scrollTo({top:0,behavior:'smooth'});
}
function delPrompt(p){
  if(!confirm('"'+p.title+'" delete kar dun?'))return;
  api('/rest/v1/prompts?id=eq.'+p.id,'DELETE')
    .then(function(){return deleteMedia(mediaPath(p.media_url))})
    .then(loadList).catch(function(e){alert('Delete nahi hua: '+e.message)});
}
if(token){api('/rest/v1/prompts?select=id&limit=1','GET').then(function(){setLoggedIn(true)}).catch(function(){setLoggedIn(false)})}
})();
</script>
</body>
</html>
